name: release

# Builds the one-file Setup on Windows.
# - push a tag v<version> (same as the VERSION file) -> GitHub release with the Setup attached
# - run it by hand (Actions > release > Run workflow) -> the Setup as a downloadable build artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build launcher, runtime and Setup
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DolbyAccessCustom-Setup
          path: dist/DolbyAccessCustom-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$ver") { throw "Tag $tag does not match VERSION $ver" }
          $notes = Join-Path $env:RUNNER_TEMP notes.md
          # release notes = this version's section of CHANGELOG.md
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          Set-Content $notes $(if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Dolby Access Custom $ver" })
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag (Get-Item dist/DolbyAccessCustom-Setup-*.exe) --clobber }
          else { gh release create $tag (Get-Item dist/DolbyAccessCustom-Setup-*.exe) --title "Dolby Access Custom $ver" --notes-file $notes }
